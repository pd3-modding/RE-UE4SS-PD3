;; Member-variable layout overrides for PAYDAY 3 3.8 (build 24964769, UE 5.5 custom fork).
;;
;; Verified empirically 2026-08-28 via UE4SS [PD3-DIAG] live-object scans (docs/deploy-log.md).
;; The PD3 3.8 fork changes stock UE 5.5 in three ways, and UE4SS's 5_05 tables miss all of
;; them (they also don't match the 5_06/5_07 tables, so it's not a version detection issue):
;;   1. UObjectBase is 0x30 instead of 0x28: the FName region is 16 bytes wide
;;      ({comparison-idx, 0, comparison-idx, 0}, name read at +0x18), which shifts
;;      OuterPrivate from 0x20 to 0x28.
;;   2. UField gains a second 8-byte field at +0x38 (after Next@0x30), so UStruct/Ldata
;;      fields start 0x10 higher than stock instead of 0x8.
;;   3. FName is 16 bytes engine-wide, so mid-struct FName members (UClass::ClassConfigName)
;;      add another +8 (measured: ClassWithin 0xE0->0xE8 but ClassDefaultObject 0x110->0x120).
;; MEASURED (pointer-scan hits): UObjectBase.{OuterPrivate}, UStruct.{SuperStruct,Children},
;; UClass.{ClassWithin,ClassDefaultObject,FuncMap@TSet-data,NativeFunctionLookupTable},
;; UField.Next, FField.{ClassPrivate,Next,NamePrivate-comp-idx}, ClassPrivate/ClassDefaultObject
;; of UFunction/CDO chains. Predicted (+8, consistent with every measurement): all other fields.
;; If property reads print nonsense after boot, re-verify [FProperty] with a probe.

[UObjectBase]
; measured: InternalIndex@0xC == slot index; ClassPrivate@0x10 -> "Class"/"Function"
OuterPrivate = 0x28
UEP_TotalSize = 0x30

[UField]
;; measured: Conv_NameToString->Next and first-class-child UField chain
Next = 0x30
UEP_TotalSize = 0x40

[UStruct]
SuperStruct = 0x48
Children = 0x50
ChildProperties = 0x58
PropertiesSize = 0x60
MinAlignment = 0x64
Script = 0x68
PropertyLink = 0x78
RefLink = 0x80
DestructorLink = 0x88
PostConstructLink = 0x90
ScriptAndPropertyObjectReferences = 0x98
UnresolvedScriptProperties = 0xA8
UEP_TotalSize = 0xB8

[UClass]
;; +8 through ClassWithin, +16 from ClassConfigName onward (FName grown to 16 bytes)
ClassConstructor = 0xB8
ClassVTableHelperCtorCaller = 0xC0
ClassUnique = 0xD0
FirstOwnedClassRep = 0xD4
bCooked = 0xD8
bLayoutChanging = 0xD9
ClassFlags = 0xDC
ClassCastFlags = 0xE0
ClassWithin = 0xE8
ClassConfigName = 0xF0
NetFields = 0x110
ClassDefaultObject = 0x120
FuncMap = 0x138
Interfaces = 0x1E8
NativeFunctionLookupTable = 0x200
UEP_TotalSize = 0x210

[UFunction]
;; UFunction body follows the UStruct prefix (0x48..0xB8 span ends at 0xB8), + everything
;; below shifts +8; object size 0xF0 matches the malloc-bucket boundary seen in the scans.
FunctionFlags = 0xB8
NumParms = 0xBC
ParmsSize = 0xBE
ReturnValueOffset = 0xC0
RPCId = 0xC2
RPCResponseId = 0xC4
FirstPropertyToInit = 0xC8
EventGraphFunction = 0xD0
EventGraphCallOffset = 0xD8
Func = 0xE0
UEP_TotalSize = 0xF0

[FField]
;; FField is not UObject-derived; the FName-in-NamePrivate widening shifts FlagsPrivate and
;; everything FProperty puts after FField
NamePrivate = 0x20
Next = 0x18

[FProperty]
ArrayDim = 0x38
ElementSize = 0x3C
PropertyFlags = 0x40
RepIndex = 0x48
Offset_Internal = 0x4C
PropertyLinkNext = 0x50
NextRef = 0x58
DestructorLinkNext = 0x60
PostConstructLinkNext = 0x68
RepNotifyFunc = 0x70
UEP_TotalSize = 0x78