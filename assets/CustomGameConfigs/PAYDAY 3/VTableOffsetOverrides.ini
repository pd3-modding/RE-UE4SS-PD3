; VTableOffsetOverrides.ini -- PAYDAY 3, Update 3.8 (buildid 24964769, UE 5.5 shipping)
;
; WHY THIS FILE EXISTS
; -------------------
; UE4SS's generated 5_05 vtable tables were produced from a build with different
; compile-time feature flags than PAYDAY 3's shipping build. Editor-only and
; plugin-gated virtuals that exist in one build and not the other shift every slot
; after them, and the shift is NOT uniform across a class -- AActor is +0x20 around
; BeginPlay but back to ~0 by AActor::Tick, so a single per-class delta is wrong too.
;
; VTableLayout.ini cannot express this: it derives offsets from an entry's index, so
; it needs the complete ordered virtual list for the class. This file overrides
; individual functions by name instead, which is all UE4SS needs for the handful of
; virtuals it actually hooks.
;
; HOW THESE WERE DERIVED
; ----------------------
; Statically, from PAYDAY3-Win64-Shipping.exe in Ghidra (tools/ghidra-project). The
; binary has no RTTI and no log strings, so each entry is identified by matching the
; *shape* of the compiled body against what UE 5.5's source says the function does.
; Offsets are into the class vtable, matching UE4SS's VTableLayoutMap convention.
;
; Anchors: AActor vtable RVA 0x71A0A68, UGameEngine vtable RVA 0x7EB7920 (the latter
; confirmed against the running process -- UE4SS logged slot 0x308 holding
; 0x7ff6f10238cc, which is RVA 0x38738CC at base 0x7ff6ed7b0000).

[AActor]
; UE4SS 5_05 says BeginPlay = 0x3A0 / EndPlay = 0x3A8. Those slots actually hold
; AddTickPrerequisiteActor / AddTickPrerequisiteComponent: both are the same tiny body
; `sub rsp,28; test byte[rcx+0x3A],2; test rdx,rdx; test byte[rdx+0x3A],2;
; lea r8,[rdx+0x30]; add rcx,0x30; call` -- i.e. PrimaryActorTick (AActor+0x30),
; bCanEverTick (+0x3A bit 1), AddPrerequisite(Other, Other->PrimaryActorTick). 0x3B0/0x3B8
; are the matching Remove* pair (same body minus the bCanEverTick tests).
;
; Hooking those instead of BeginPlay/EndPlay is why HookEndPlay crashed: the detour
; handed a UActorComponent* (rdx) to a callback typed as EEndPlayReason::Type.
;
; The real pair is +0x20 further on, and the four slots after them are pure `E9` tail
; jumps -- exactly NotifyActorBeginOverlap / EndOverlap / BeginCursorOver / EndCursorOver,
; which in UE are one-liners forwarding to their Receive* blueprint events. Both targets
; are large frames with a stack cookie, matching BeginPlay/EndPlay's TInlineComponentArray.
BeginPlay = 0x3C0
EndPlay = 0x3C8

[UEngine]
; UE4SS 5_05 says Tick = 0x308 and LoadMap = 0x4E0; everything here is +0x8. Four
; independent confirmations:
;   1. UE4SS's own AOB scan finds Tick at RVA 0x3286CF0, which sits at slot 0x310.
;   2. Slot 0x500 is `mov rax,[rcx]; xor edx,edx; jmp [rax+0x4F0]` -- that is
;      LoadMapRedrawViewports() { RedrawViewports(false); }. UE4SS puts
;      LoadMapRedrawViewports at 0x4F8 and RedrawViewports at 0x4E8; both +0x8, and the
;      0x10 gap between them is preserved.
;   3. Slot 0x320 starts `movsd xmm0, [rip+...]` (returns a double) = 0x318
;      CorrectNegativeTimeDelta, the only double-returning virtual in that run.
;   4. Slot 0x4E8 starts `mov rax,rsp; mov [rax+0x20],r9` -- it spills a 4th argument,
;      matching LoadMap(FWorldContext&, FURL, UPendingNetGame*, FString&).
Tick = 0x310
LoadMap = 0x4E8

[UObject]
; UE4SS 5_05 says ProcessEvent = 0x278 and ProcessConsoleExec = 0x290. Both of those
; slots hold /OPT:ICF-folded stubs (0xF71DF0 = `ret 0`, 0xF71D50 = `xor al,al; ret`),
; each shared by dozens of unrelated virtuals -- so neither is the function. Everything
; from ~0x118 onward is shifted +0x8 relative to UE4SS's table.
;
; Derived from a clean UObject vtable at RVA 0x6D05198 (found by searching .rdata for
; the ProcessEvent pointer, then confirming the UObject prefix matches AActor's exactly:
; 0x008/0x010/0x018/0x020 identical, 0x0A0 = `return false` ResolveSubobject,
; 0x0A8 = `return true` IsReadyForAsyncPostLoad, 0x108 = `cmp edx,2; sete` which is
; PostDuplicate(Mode == EDuplicateMode::PIE)).
;
; The run of four slots 0x280..0x298 matches Object.h's declaration order exactly:
;   0x280 ProcessEvent          RVA 0x12C7A74  large frame, pushes 6 callee-saved regs,
;                                              sub rsp,0x100 -- builds an FFrame.
;                                              Confirmed: AActor::ProcessEvent (slot
;                                              0x280 of AActor's vtable, RVA 0x2F01A64)
;                                              calls GetWorld() then CALLs 0x12C7A74 --
;                                              that is its Super::ProcessEvent.
;   0x288 GetFunctionCallspace  `mov eax,2; ret` = FunctionCallspace::Local
;   0x290 CallRemoteFunction    `xor al,al; ret` = return false
;   0x298 ProcessConsoleExec    RVA 0x113DC64:
;                                 sub rsp,0x38 / mov byte[rsp+0x20],0 /
;                                 call 0x12BAB78 / add rsp,0x38 / ret
;                               i.e. `return CallFunctionByNameWithArguments(...)`,
;                               which is the body UE 5.5 gives it -- NOT `return false`.
;
; Side effect: UObject::CallFunctionByNameWithArguments is RVA 0x12BAB78. UE4SS derives
; that address by decoding ProcessConsoleExec's body, so fixing the slot below fixes it
; too -- the CALL is at +0x9, well inside the decoder's window.
ProcessEvent = 0x280
ProcessConsoleExec = 0x298

