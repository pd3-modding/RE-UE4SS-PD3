;; Member-variable layout overrides for PAYDAY 3 3.8 (build 24964769, UE 5.5).
;;
;; ROOT CAUSE (audited 2026-08-28 against the real UE 5.5 source under
;; C:\Program Files\Epic Games\UE_5.5\Engine\Source\Runtime):
;; PAYDAY 3 is compiled WITH_CASE_PRESERVING_NAME=1. That makes FName 12 bytes
;; (ComparisonIndex + Number + DisplayIndex) instead of 8. Every offset below follows from
;; that one flag applied to otherwise-stock UE 5.5 layouts. There is no bespoke "PD3 fork
;; layout" -- earlier notes here claimed a 16-byte FName plus a mystery extra UField field;
;; both were wrong and are superseded.
;;
;; Why this file is needed: UE4SS ships a case-preserving offset table, but ONLY for 4.27
;; (UnrealVirtual427.cpp is the sole version impl with a WITH_CASE_PRESERVING_NAME branch;
;; the other 28 have none), so the 5.05 path applies stock 8-byte-FName offsets. The DLL is
;; built CasePreserving__Shipping__Win64, so UE4SS's own FName struct IS 12 bytes -- only the
;; generated tables disagreed. Upstream fix: add a case-preserving branch to
;; UnrealVirtual505.cpp mirroring 427's.
;;
;; DERIVATION + VALIDATION: offsets computed from real 5.5 member order, then checked against
;; live [PD3-DIAG] probe measurements (derived independently, not fitted to the probes):
;;   [UStruct]   12/12 members match, total 0xB8 exact
;;   [UClass]    15/15 members match, total 0x210 exact
;;   [UFunction] 10/10 members match
;;   [FField]+[FProperty] 16/16 match (FFieldVariant is an 8-byte TAGGED POINTER in 5.5)
;; UStruct's "extra" 8 bytes are the private FStructBaseChain base (placed before the members
;; by MSVC) plus the non-editor UnversionedGameSchema pointer.
;;
;; GOTCHA: keys must match UE4SS's MemberOffsets names EXACTLY or they are dropped with no
;; warning -- including upstream's misspelled "UnqiueNameIndexCounter" [sic].

[UObjectBase]
; measured: InternalIndex@0xC == slot index; ClassPrivate@0x10 -> "Class"/"Function"
OuterPrivate = 0x28
UEP_TotalSize = 0x30

[UField]
;; measured: Conv_NameToString->Next and first-class-child UField chain
Next = 0x30
UEP_TotalSize = 0x40

[UStruct]
SuperStruct = 0x48
Children = 0x50
ChildProperties = 0x58
PropertiesSize = 0x60
MinAlignment = 0x64
Script = 0x68
PropertyLink = 0x78
RefLink = 0x80
DestructorLink = 0x88
PostConstructLink = 0x90
ScriptAndPropertyObjectReferences = 0x98
UnresolvedScriptProperties = 0xA8
UEP_TotalSize = 0xB8

[UClass]
;; The 12-byte case-preserving ClassConfigName FName pads to 16, which is why members from
;; NetFields onward shift +16 rather than +8. ClassReps (TArray, 0x100) is absent from
;; UE4SS's table entirely; it is the gap between ClassConfigName and NetFields.
ClassConstructor = 0xB8
ClassVTableHelperCtorCaller = 0xC0
ClassUnique = 0xD0
FirstOwnedClassRep = 0xD4
bCooked = 0xD8
bLayoutChanging = 0xD9
ClassFlags = 0xDC
ClassCastFlags = 0xE0
ClassWithin = 0xE8
ClassConfigName = 0xF0
NetFields = 0x110
ClassDefaultObject = 0x120
;; SparseClassData/Struct sit between CDO and FuncMap; UE4SS's 5_05 table has them, ours
;; omitted them. Derived from 5.5 member order, consistent with measured FuncMap = 0x138.
SparseClassData = 0x128
SparseClassDataStruct = 0x130
FuncMap = 0x138
Interfaces = 0x1E8
NativeFunctionLookupTable = 0x200
UEP_TotalSize = 0x210

[UFunction]
;; UFunction body follows the UStruct prefix (0x48..0xB8 span ends at 0xB8), + everything
;; below shifts +8; object size 0xF0 matches the malloc-bucket boundary seen in the scans.
FunctionFlags = 0xB8
NumParms = 0xBC
ParmsSize = 0xBE
ReturnValueOffset = 0xC0
RPCId = 0xC2
RPCResponseId = 0xC4
FirstPropertyToInit = 0xC8
EventGraphFunction = 0xD0
EventGraphCallOffset = 0xD8
Func = 0xE0
;; Func is the last member in a shipping build (SingletonPtr is WITH_LIVE_CODING only),
;; so the struct ends at 0xE8. 0xF0 was an earlier guess from a malloc-bucket boundary.
UEP_TotalSize = 0xE8

[FField]
;; MEASURED 2026-08-28 (raw dword dump, 3 live FFields): ClassPrivate@0 is the FFieldClass*,
;; @0x8 a class-tagged exe pointer, @0x10 the owner (tagged: ...F0631 = UClass|bIsUObject),
;; Next@0x18 (verified: points at the next chain field), NamePrivate@0x20 (comp idx verified
;; against GetNamePrivate().GetComparisonIndex()), FlagsPrivate@0x2C (0x45 on all probes).
NamePrivate = 0x20
Next = 0x18
FlagsPrivate = 0x2C
UEP_TotalSize = 0x30

[FFieldClass]
;; FFieldClass's FName sits at 0x0 (so GetFName still works un-overridden); the 12-byte
;; case-preserving FName pads to 16 and shifts every later member +8. Without SuperClass=0x28, the
;; TypeChecker's superclass walks (e.g. FMulticastSparseDelegateProperty ->
;; FMulticastDelegateProperty) read ClassFlags and the base-class FFieldClass registration
;; stores garbage -> StaticClass() throws at dumper init.
Id = 0x10
CastFlags = 0x18
ClassFlags = 0x20
SuperClass = 0x28
DefaultObject = 0x30
ConstructFn = 0x38
UnqiueNameIndexCounter = 0x40  ; [sic] upstream UE4SS misspells this key; must match to take effect
UEP_TotalSize = 0x48

[FProperty]
;; Base fields match the 5_05 stock table exactly (FField ends at 0x30 in both cases: 5.5's
;; FFieldVariant Owner is an 8-byte tagged pointer, not the 4.27 ptr+bool). The trailing
;; 12-byte RepNotifyFunc FName pads the struct to 0x78, so every derived (leaf) property
;; class shifts +8 vs its 5_05 stock offsets (see sections below).
;; Verified: ArrayDim=1 @0x30, ElementSize (1 = bool/byte) @0x34, PropertyFlags u64
;; patterns @0x38, Offset_Internal aligned @0x44, PropertyLinkNext == next field @0x48;
;; FBoolProperty masks measured @0x78 (native-bool 01,00,01,01 / bitfield 01,00,04,04);
;; FStructProperty Struct @0x78; FMapProperty KeyProp @0x78, ValueProp @0x80, MapLayout @0x88.
;; Our earlier +8 guesses on the BASE fields (ArrayDim=0x38 etc.) were wrong and caused the
;; mapproperty_to_string_complex crash — base = stock, only the tail/derived +8.
ArrayDim = 0x30
ElementSize = 0x34
PropertyFlags = 0x38
RepIndex = 0x40
Offset_Internal = 0x44
PropertyLinkNext = 0x48
NextRef = 0x50
DestructorLinkNext = 0x58
PostConstructLinkNext = 0x60
RepNotifyFunc = 0x68
UEP_TotalSize = 0x78

[FObjectPropertyBase]
PropertyClass = 0x78
UEP_TotalSize = 0x80

[FMapProperty]
KeyProp = 0x78
ValueProp = 0x80
MapLayout = 0x88
MapFlags = 0xA0
UEP_TotalSize = 0xA8

[FArrayProperty]
ArrayFlags = 0x78
Inner = 0x80
UEP_TotalSize = 0x88

[FStructProperty]
Struct = 0x78
UEP_TotalSize = 0x80

[FBoolProperty]
FieldSize = 0x78
ByteOffset = 0x79
ByteMask = 0x7A
FieldMask = 0x7B
UEP_TotalSize = 0x80

[FByteProperty]
Enum = 0x78
UEP_TotalSize = 0x80

[FEnumProperty]
UnderlyingProp = 0x78
Enum = 0x80
UEP_TotalSize = 0x88

[FClassProperty]
MetaClass = 0x80
UEP_TotalSize = 0x88

[FDelegateProperty]
SignatureFunction = 0x78
UEP_TotalSize = 0x80

[FMulticastDelegateProperty]
SignatureFunction = 0x78
UEP_TotalSize = 0x80

[FSetProperty]
ElementProp = 0x78
SetLayout = 0x80
UEP_TotalSize = 0x98

[FFieldPathProperty]
PropertyClass = 0x78
UEP_TotalSize = 0x80

[FInterfaceProperty]
InterfaceClass = 0x78
UEP_TotalSize = 0x80

[UEnum]
;; DERIVED from real UE 5.5 Class.h member order (CppType, Names, CppForm, EnumFlags,
;; EnumPackage, EnumDisplayNameFn) laid out with a 12-byte case-preserving FName.
;; Cross-checks against the live probe of 3 UEnums: CppForm=2/1 @0x58,
;; EnumPackage FName {0x412,0,0x412} @0x5C..0x64, next object's vtable at +0x70.
CppType = 0x38
Names = 0x48
CppForm = 0x58
EnumFlags_Internal = 0x59
EnumPackage = 0x5C
EnumDisplayNameFn = 0x68
UEP_TotalSize = 0x70

[UScriptStruct]
;; DERIVED from 5.5 member order on the validated UStruct base (ends 0xB8).
StructFlags = 0xB8
bPrepareCppStructOpsCompleted = 0xBC
CppStructOps = 0xC0
UEP_TotalSize = 0xC8

[USparseDelegateFunction]
;; DERIVED: UFunction (ends 0xE8) + two 12-byte case-preserving FNames.
OwningClassName = 0xE8
DelegateName = 0xF4
; (UE4SS tracks no UEP_TotalSize for this class)
